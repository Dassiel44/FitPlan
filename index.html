<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5f6f27">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Forja</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Concepto: app móvil de una columna, cabecera fija, barra de pestañas inferior y menú lateral para temas.
   Cada paleta define valores claros (--l-*) y oscuros (--d-*); los tokens activos (--bg, --accent...) apuntan a uno u otro. */
:root{
  --l-bg:#f6f2df;--l-surface:#fffdf3;--l-surface2:#ece8cf;--l-fg:#2b2f1c;--l-muted:#666a50;--l-line:#ddd8bb;--l-accent:#5f6f27;--l-onaccent:#fffdf3;--l-accent2:#eaa9bb;--l-onaccent2:#3a1f27;
  --d-bg:#1a1d12;--d-surface:#23271a;--d-surface2:#2d321f;--d-fg:#f1eed8;--d-muted:#a7aa8c;--d-line:#3a4026;--d-accent:#b4c25a;--d-onaccent:#1a1d12;--d-accent2:#e8a9bb;--d-onaccent2:#2b1520;
  --l-ok:#2e7d4f;--d-ok:#5ccf8c;--l-warn:#a8680f;--d-warn:#e7b44f;--l-bad:#b3261e;--d-bad:#ff7a70;
  --bg:var(--l-bg);--surface:var(--l-surface);--surface2:var(--l-surface2);--fg:var(--l-fg);--muted:var(--l-muted);--line:var(--l-line);
  --accent:var(--l-accent);--onaccent:var(--l-onaccent);--accent2:var(--l-accent2);--onaccent2:var(--l-onaccent2);
  --ok:var(--l-ok);--warn:var(--l-warn);--bad:var(--l-bad);
  --font-d:'Bricolage Grotesque','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  color-scheme:light;
}
:root[data-pal="tinta"]{--l-bg:#eef2f7;--l-surface:#ffffff;--l-surface2:#e0e8f1;--l-fg:#0e1f3b;--l-muted:#566884;--l-line:#cbd6e4;--l-accent:#13306b;--l-onaccent:#ffffff;--l-accent2:#0b8a5f;--l-onaccent2:#ffffff;
  --d-bg:#0b1426;--d-surface:#121e36;--d-surface2:#1a2947;--d-fg:#e8eef8;--d-muted:#93a3bd;--d-line:#243556;--d-accent:#34d39f;--d-onaccent:#062a1d;--d-accent2:#7aa2f7;--d-onaccent2:#0b1426}
:root[data-pal="terracota"]{--l-bg:#fbf0e8;--l-surface:#fffaf6;--l-surface2:#f4dfd2;--l-fg:#3a2018;--l-muted:#7a584b;--l-line:#ecd2c3;--l-accent:#b24a24;--l-onaccent:#ffffff;--l-accent2:#8cc5ea;--l-onaccent2:#10283a;
  --d-bg:#1f1411;--d-surface:#2b1c17;--d-surface2:#37251e;--d-fg:#f7e6dc;--d-muted:#bf9f90;--d-line:#473027;--d-accent:#ef8a62;--d-onaccent:#2a120a;--d-accent2:#8cc5ea;--d-onaccent2:#10283a}
:root[data-pal="magenta"]{--l-bg:#f2f1ee;--l-surface:#ffffff;--l-surface2:#e8e6e1;--l-fg:#22202a;--l-muted:#6a6672;--l-line:#dcd9d2;--l-accent:#bb2649;--l-onaccent:#ffffff;--l-accent2:#0f4c81;--l-onaccent2:#ffffff;
  --d-bg:#17151b;--d-surface:#211e27;--d-surface2:#2b2733;--d-fg:#f1eff3;--d-muted:#a29dac;--d-line:#35303f;--d-accent:#ee5f84;--d-onaccent:#2a0912;--d-accent2:#6fa4dd;--d-onaccent2:#0c1c2e}
:root[data-pal="tango"]{--l-bg:#fff5ec;--l-surface:#ffffff;--l-surface2:#ffe6d3;--l-fg:#231f3d;--l-muted:#6a6590;--l-line:#f2d9c6;--l-accent:#d1430f;--l-onaccent:#ffffff;--l-accent2:#5a5b9f;--l-onaccent2:#ffffff;
  --d-bg:#14122a;--d-surface:#1d1a3a;--d-surface2:#27244b;--d-fg:#f3f0ff;--d-muted:#a9a5d1;--d-line:#34306a;--d-accent:#ff8a4d;--d-onaccent:#2b1204;--d-accent2:#9e9cf0;--d-onaccent2:#141231}
:root[data-pal="grafito"]{--l-bg:#f1f2ee;--l-surface:#ffffff;--l-surface2:#e4e6df;--l-fg:#1e2220;--l-muted:#5d655e;--l-line:#d3d7cd;--l-accent:#2a302c;--l-onaccent:#e9ff74;--l-accent2:#c8f03c;--l-onaccent2:#1e2220;
  --d-bg:#121413;--d-surface:#1b1e1c;--d-surface2:#252927;--d-fg:#eef1ea;--d-muted:#98a097;--d-line:#2f3431;--d-accent:#d2f548;--d-onaccent:#151a05;--d-accent2:#8a948c;--d-onaccent2:#121413}
:root[data-pal="borgona"]{--l-bg:#f7efe8;--l-surface:#fffaf6;--l-surface2:#eadcd2;--l-fg:#2e1218;--l-muted:#7a5560;--l-line:#e2cfc4;--l-accent:#7a1f3a;--l-onaccent:#ffffff;--l-accent2:#c9973b;--l-onaccent2:#2a1b05;
  --d-bg:#1c0e12;--d-surface:#271319;--d-surface2:#331b22;--d-fg:#f6e8e0;--d-muted:#bb98a0;--d-line:#46252e;--d-accent:#e0728f;--d-onaccent:#2a0b14;--d-accent2:#e0b25a;--d-onaccent2:#2a1b05}
:root[data-pal="mar"]{--l-bg:#eaf4f4;--l-surface:#ffffff;--l-surface2:#d6e8e8;--l-fg:#0e2a30;--l-muted:#4c6d74;--l-line:#c3dcdc;--l-accent:#0d6a73;--l-onaccent:#ffffff;--l-accent2:#ff7b6b;--l-onaccent2:#3a0d08;
  --d-bg:#08191c;--d-surface:#0f2428;--d-surface2:#163035;--d-fg:#e3f4f4;--d-muted:#8fb3b8;--d-line:#1f4349;--d-accent:#43c6cf;--d-onaccent:#05242a;--d-accent2:#ff8f80;--d-onaccent2:#3a0d08}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:var(--d-bg);--surface:var(--d-surface);--surface2:var(--d-surface2);--fg:var(--d-fg);--muted:var(--d-muted);--line:var(--d-line);
    --accent:var(--d-accent);--onaccent:var(--d-onaccent);--accent2:var(--d-accent2);--onaccent2:var(--d-onaccent2);
    --ok:var(--d-ok);--warn:var(--d-warn);--bad:var(--d-bad);color-scheme:dark}
}
:root[data-mode="dark"],:root[data-theme="dark"]:not([data-mode="light"]){
  --bg:var(--d-bg);--surface:var(--d-surface);--surface2:var(--d-surface2);--fg:var(--d-fg);--muted:var(--d-muted);--line:var(--d-line);
  --accent:var(--d-accent);--onaccent:var(--d-onaccent);--accent2:var(--d-accent2);--onaccent2:var(--d-onaccent2);
  --ok:var(--d-ok);--warn:var(--d-warn);--bad:var(--d-bad);color-scheme:dark}

*{box-sizing:border-box}
html{font-size:clamp(16px,4.2vw,18px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.45 var(--font-b);overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.08rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;max-width:560px;margin:0 auto}
#top h1{font-size:1.5rem;line-height:1}
#top .sub{margin-left:auto;min-width:0;color:var(--muted);font-size:.85rem;text-align:right}
.icon-btn{border:0;background:var(--surface);border:1px solid var(--line);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
main{max-width:560px;margin:0 auto;padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:var(--surface2);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--onaccent);min-height:44px}
.btn.alt{background:var(--accent2);color:var(--onaccent2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 2px}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.inp input,.inp select{border:0;background:transparent;outline:0;width:100%;min-width:0;padding:10px 0}
.inp:focus-within{border-color:var(--accent)}
.inp em{font-style:normal;color:var(--muted);font-size:.85rem}
.inp select{appearance:none;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}
.seg button{min-width:0;flex:1;border:0;background:transparent;border-radius:9px;padding:9px 3px;font-size:.92rem;font-weight:700;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
input[type=range]{width:100%;accent-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.stat b{font-family:var(--font-d);font-size:1.8rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat.hi{background:var(--accent);color:var(--onaccent);border-color:transparent}
.stat.hi span{color:inherit;opacity:.85}
.stat span{font-size:.8rem;color:var(--muted)}
.kv{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--warn)}
.mac{display:flex;flex-direction:column;gap:5px}
.mac .row{font-size:.88rem}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.item .t{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;min-width:38px;height:38px;padding:0 10px;font-weight:700;display:inline-grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--accent2);color:var(--onaccent2);border-color:transparent}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--accent2);color:var(--onaccent2);font-size:.76rem;font-weight:700}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.done .t{text-decoration:line-through;color:var(--muted)}
details.card>summary{cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1}
details.card[open]>summary::after{content:"–"}
details.in{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px}
details.in summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:700}
ul.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

.ringwrap{position:relative;width:min(240px,70%);margin:0 auto}
.ring{width:100%;display:block}
.ring circle{fill:none;stroke-width:12}
.ring-bg{stroke:var(--surface2)}
.ring-fg{stroke:var(--accent2);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-family:var(--font-d);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+i{background:var(--accent);border-color:var(--accent)}
.switch input:checked+i::after{left:25px;background:var(--onaccent)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.vid{width:100%;max-width:100%;height:auto;border-radius:12px;background:#000;display:block;aspect-ratio:3/4}
.bigimg{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface2)}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;gap:2px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
#tabs button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.74rem;font-weight:700;min-width:0}
#tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
#tabs span.l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sheet-b{padding:6px 16px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
#drawer{position:fixed;inset:0;z-index:60;display:none}
#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(88vw,340px);background:var(--surface);border-right:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:16px}
.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;text-align:left;font-size:.8rem;font-weight:700;min-height:48px}
.pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.sw{display:flex;flex:none}
.sw i{width:18px;height:28px;display:block}
.sw i:first-child{border-radius:8px 0 0 8px}.sw i:last-child{border-radius:0 8px 8px 0}
#toasts{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:500;max-width:520px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.act{display:flex;flex-direction:column;gap:8px;background:var(--accent2);color:var(--onaccent2);padding:14px}
.toast.act .row{gap:8px}

/* ---- inicio: racha y calendario ---- */
.streak{display:flex;gap:14px;align-items:center}
.flame{width:68px;height:68px;flex:none;display:grid;place-items:center;border-radius:20px;background:var(--surface2);color:var(--muted)}
.flame svg{width:36px;height:36px}
.flame.on{background:var(--accent2);color:var(--onaccent2)}
.sn{font-family:var(--font-d);font-size:2.6rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:700}
.dot{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);color:transparent;padding:0}
.dot svg{width:16px;height:16px}
.dot.train{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.dot.rest{background:var(--surface2);border-style:dashed;color:var(--muted)}
.dot.saved{background:var(--accent2);border-color:var(--accent2);color:var(--onaccent2)}
.dot.miss{border-color:var(--bad);color:var(--bad)}
.dot.today{box-shadow:0 0 0 2px var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700;padding:2px 0}
.day{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0;overflow:hidden;color:var(--fg);font-size:.78rem;font-weight:700;min-width:0}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.day .n{position:absolute;top:2px;left:3px;line-height:1;padding:1px 3px;border-radius:5px}
.day.has .n{background:rgba(0,0,0,.55);color:#fff}
.day .m{position:absolute;right:2px;bottom:2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent)}
.day .m svg{width:11px;height:11px}
.day .m.no{background:var(--bad);color:#fff}
.day.s-rest{background:var(--surface2)}
.day.s-train{border-color:var(--accent)}
.day.s-miss{border-color:var(--bad)}
.day.s-saved{border-color:var(--accent2)}
.day.fut{opacity:.55}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}

/* ---------- estado ---------- */
const S={
  tab:'inicio', today:ymd(), loaded:false,
  settings:{pal:'oliva',mode:'auto'},
  profile:{height:181,weight:77,age:21,sex:'m',activity:1.375,deficit:15},
  water:{goal:3000,interval:60,from:8,to:22,on:true,days:{}},
  routines:{list:[],done:{}},
  foods:{list:STARTER},
  meal:{type:'Almuerzo',items:[]},
  logs:{}, photos:{}, photosLoaded:false,
  train:{days:{},rest:[6]}, habits:{list:null}, hmarks:{},

};

const IDB={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('forja',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'date'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('photos',mode);const rq=fn(t.objectStore('photos'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);});},
  put(v){return this.tx('readwrite',st=>st.put(v));},
  del(k){return this.tx('readwrite',st=>st.delete(k));},
  all(){return this.tx('readonly',st=>st.getAll()).then(a=>a||[]);}
};
/* ---------- almacenamiento: copia local ---------- */
const Store={
  col:null,mode:'local',pending:{},timers:{},busy:{},again:{},early:new Set(),
  lget(k){try{return JSON.parse(localStorage.getItem('forja:'+k));}catch(e){return null;}},
  lset(k,v){try{localStorage.setItem('forja:'+k,JSON.stringify(v));return true;}catch(e){return false;}},
  ldel(k){try{localStorage.removeItem('forja:'+k);}catch(e){}},
  lkeys(prefix){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('forja:'+prefix))out.push(k.slice(6));}}catch(e){}return out;},
  async init(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [db,user]=await withTimeout(Promise.all([claude.use('db'),claude.use('user')]),8000);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.col=db.collection('data/users/'+id);
    }catch(e){}
  },
  kind(k){return k.startsWith('photo-')?'photo':k.startsWith('log-')?'log':'cfg';},
  save(k,v){
    if(k.startsWith('photo-')){ IDB.put(v).catch(()=>toast('No se pudo guardar la foto.')); return; }
    this.lset(k,v);
    if(!S.loaded){this.early.add(k);return;}
    this.queue(k,v);
  },
  queue(k,v){
    if(!this.col) return;
    this.pending[k]=v; clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>this.run(k),500);
  },
  async run(k){
    if(this.busy[k]){this.again[k]=true;return;}
    this.busy[k]=true;
    try{
      do{ this.again[k]=false; await this.col.doc(k).set(Object.assign({},this.pending[k],{kind:this.kind(k)})); }while(this.again[k]);
      this.mode='cloud';
    }catch(e){ this.mode='local'; }
    this.busy[k]=false;
  },
  async del(k){ this.ldel(k); if(k.startsWith('photo-')) IDB.del(k.slice(6)).catch(()=>{}); if(this.col){ try{await this.col.doc(k).delete();}catch(e){} } }
};

function docOf(k){
  if(k==='settings')return S.settings; if(k==='profile')return S.profile; if(k==='water')return S.water;
  if(k==='routines')return S.routines; if(k==='foods')return S.foods;
  if(k==='train')return S.train; if(k==='habits')return S.habits; if(k.startsWith('hab-'))return S.hmarks[k.slice(4)];
  if(k.startsWith('log-'))return S.logs[k.slice(4)]; if(k.startsWith('photo-'))return S.photos[k.slice(6)];
}
function save(k){ const v=docOf(k); if(v) Store.save(k,v); }
function applyDoc(k,v){
  if(!v) return;
  if(k==='settings')Object.assign(S.settings,v);
  else if(k==='profile')Object.assign(S.profile,v);
  else if(k==='water')Object.assign(S.water,v);
  else if(k==='routines')S.routines=Object.assign({list:[],done:{}},v);
  else if(k==='foods'&&Array.isArray(v.list))S.foods={list:v.list};
  else if(k==='train')S.train=Object.assign({days:{},rest:[6]},v);
  else if(k==='habits'&&Array.isArray(v.list))S.habits={list:v.list};
  else if(k.startsWith('hab-'))S.hmarks[k.slice(4)]=v;
  else if(k.startsWith('log-'))S.logs[k.slice(4)]=v;
  else if(k.startsWith('photo-'))S.photos[k.slice(6)]=v;
}
function loadLocal(){
  ['settings','profile','water','routines','foods','train','habits'].forEach(k=>applyDoc(k,Store.lget(k)));
  Store.lkeys('log-').forEach(k=>applyDoc(k,Store.lget(k)));
  Store.lkeys('hab-').forEach(k=>applyDoc(k,Store.lget(k)));
  if(!S.habits.list)S.habits={list:DEFAULT_HABITS()};
  const m=Store.lget('meal'); if(m&&Array.isArray(m.items)) S.meal=m;
}
async function loadCloud(){
  await Store.init();
  if(Store.col){
    try{
      const snap=await withTimeout(Store.col.where('kind','!=','photo').get(),9000);
      snap.docs.forEach(d=>applyDoc(d.id,d.data()));
      Store.mode='cloud';
    }catch(e){Store.mode='local';}
  }
  S.loaded=true;
  if(!S.habits.list)S.habits={list:DEFAULT_HABITS()};
  S.water.days=S.water.days||{};
  Store.early.forEach(k=>Store.queue(k,docOf(k)));
  Store.early.clear();
  applyTheme(); go(S.tab); scheduleNext();
}
async function loadPhotos(){
  if(S.photosLoaded) return; S.photosLoaded=true;
  try{(await IDB.all()).forEach(p=>{S.photos[p.date]=p;});}catch(e){}
  if(Store.col){
    try{ const snap=await withTimeout(Store.col.where('kind','==','photo').get(),12000); snap.docs.forEach(d=>applyDoc(d.id,d.data())); }catch(e){}
  }
}

async function getDl(){
  if(NATIVE()) return {save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data]);
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});
    const w=await getPlug('Filesystem').writeFile({path:filename,data:b64,directory:'CACHE'});
    await getPlug('Share').share({title:filename,url:w.uri});return {status:'saved'};}};
  try{ if(window.claude&&claude.use){const d=await claude.use('downloads'); if(d) return d;} }catch(e){}
  return {save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'};}};
}
async function exportData(){
  await loadPhotos();
  const dl=await getDl();

/* ---------- PERFIL ---------- */
function calc(){
  const p=S.profile;
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity;
  let target=tdee*(1-p.deficit/100), floored=false;
  if(target<bmr){target=bmr;floored=true;}
  const prot=p.weight*1.8, protMin=p.weight*1.2, fat=p.weight*0.8;
  const carbs=Math.max(0,(target-prot*4-fat*9)/4);
  return {bmr,tdee,target,deficit:tdee-target,prot,protMin,fat,carbs,fiber:target/1000*14,floored};
}

      h('div',{class:'fld'},h('div',{class:'row sb'},h('label',{for:'f-def',class:'small muted',style:'text-transform:uppercase;letter-spacing:.06em'},'Déficit calórico'),defVal),

const ZERO=()=>({kcal:0,p:0,c:0,g:0,f:0});
function sumOf(arr,pick){const t=ZERO();arr.forEach(x=>{const s=pick?pick(x):x;for(const k of ['kcal','p','c','g','f'])t[k]+=s[k]||0;});return t;}
function dayMeals(date){const L=S.logs[date.slice(0,7)];return (L&&L.days&&L.days[date]&&L.days[date].meals)||[];}
const per=(it)=>{const k=it.grams/100;return {kcal:it.kcal*k,p:it.p*k,c:it.c*k,g:it.g*k,f:it.f*k};};
const rnd=o=>{const r={};for(const k in o)r[k]=typeof o[k]==='number'?Math.round(o[k]*10)/10:o[k];return r;};

function saveMeal(){
  const m=S.meal; if(!m.items.length) return;
  const items=m.items.map(it=>Object.assign({name:it.name,grams:it.grams},rnd(per(it))));
  const t=rnd(sumOf(items));
  const date=ymd(), ym=date.slice(0,7);
  const L=S.logs[ym]||(S.logs[ym]={days:{}});
  const D=L.days[date]||(L.days[date]={meals:[]});

  save('log-'+ym); m.items=[]; Store.lset('meal',m); toast('Comida guardada.');

const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

function routineDaysSet(){const R=S.routines.list;if(!R.length)return null;const s=new Set();R.forEach(r=>r.days.forEach(d=>s.add(d)));return s;}
function isRestDay(date){
  const w=wdIndex(date);
  if(S.train.rest.includes(w)) return true;
  const rs=routineDaysSet(); return rs?!rs.has(w):false;

/* Simula la racha día a día. Entrenar suma; descansar (domingo u otro día libre) la mantiene;
   fallar gasta un protector (se gana uno cada 7 días entrenados, máx. 2) o la reinicia. */
function trainSim(){
  const T=S.train, keys=Object.keys(T.days).filter(k=>T.days[k]&&T.days[k].st).sort();
  const res={streak:0,best:0,prot:0,trained:0,status:{}};
  if(!keys.length) return res;
  const end=parseYmd(S.today); let streak=0,best=0,prot=0,cnt=0;
  for(let d=parseYmd(keys[0]);d<=end;d=addDays(d,1)){
    const k=ymd(d), rec=T.days[k], isToday=k===S.today;
    if(rec&&rec.st==='yes'){streak++;best=Math.max(best,streak);cnt++;if(cnt%7===0)prot=Math.min(2,prot+1);res.status[k]='train';}
    else if(isRestDay(d)) res.status[k]='rest';
    else if(isToday) res.status[k]='pending';
    else if(prot>0){prot--;res.status[k]='saved';}
    else{streak=0;res.status[k]='miss';}
  }
  res.streak=streak;res.best=best;res.prot=prot;res.trained=cnt;
  return res;
}
function syncAuto(){
  const T=S.train, date=S.today, wd=wdIndex();
  const todays=S.routines.list.filter(r=>r.days.includes(wd)); if(!todays.length) return;
  const done=S.routines.done[date]||{};
  const all=todays.every(r=>r.exercises.length&&r.exercises.every(e=>done[e.id]));
  const cur=T.days[date];
  if(all){ if(!cur||cur.st!=='yes'){T.days[date]={st:'yes',auto:true};save('train');toast('Rutina completa. Racha: '+trainSim().streak+' días.');} }
  else if(cur&&cur.auto){delete T.days[date];save('train');}
}
function setTrain(k,st){
  if(st) S.train.days[k]={st}; else delete S.train.days[k];
  save('train');
}

/* ---------- COMPARTIR / IMPORTAR rutinas y alimentos ---------- */
const b64u={
  enc:u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
};
async function gz(u8,mode){const st=new (mode==='c'?CompressionStream:DecompressionStream)('gzip');const w=st.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(st.readable).arrayBuffer());}
async function packShare(obj){
  const u8=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{return 'FORJA1.'+b64u.enc(await gz(u8,'c'));}catch(e){}}
  return 'FORJA0.'+b64u.enc(u8);
}
async function unpackShare(text){
  text=String(text||''); if(text.length>2000000) throw new Error('grande');
  const m=text.match(/FORJA([01])\.([A-Za-z0-9_-]+)/); if(!m) throw new Error('formato');
  let u8=b64u.dec(m[2]);
  if(m[1]==='1'){ if(!window.DecompressionStream) throw new Error('nogz'); u8=await gz(u8,'d'); }
  if(u8.length>3000000) throw new Error('grande');
  return JSON.parse(new TextDecoder().decode(u8));
}
const cs=(v,n)=>String(v==null?'':v).slice(0,n);
const cn=(v,max)=>Math.min(max,Math.max(0,num(v,0)));
function cleanShare(o){
  const out={routines:[],foods:[]}; if(!o||typeof o!=='object') return out;
  (Array.isArray(o.routines)?o.routines:[]).slice(0,30).forEach(r=>{
    if(!r||typeof r!=='object') return; const name=cs(r.name,60).trim(); if(!name) return;
    out.routines.push({id:uid(),name,days:[...new Set((Array.isArray(r.days)?r.days:[]).map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6))],
      exercises:(Array.isArray(r.exercises)?r.exercises:[]).slice(0,40).map(e=>({id:uid(),name:cs(e&&e.name,100).trim(),sets:Math.round(cn(e&&e.sets,30))||1,reps:cs(e&&e.reps,30),weight:cs(e&&e.weight,20),note:cs(e&&e.note,200)})).filter(e=>e.name)});});
  (Array.isArray(o.foods)?o.foods:[]).slice(0,300).forEach(x=>{
    if(!x||typeof x!=='object') return; const name=cs(x.name,80).trim(); if(!name) return;
    out.foods.push({id:'f'+uid(),name,kcal:cn(x.kcal,1000),p:cn(x.p,100),c:cn(x.c,100),g:cn(x.g,100),f:cn(x.f,100)});});
  return out;
}

function applyShare(data,replace){
  let r=0,f=0;
  if(data.routines.length){
    if(replace){S.routines.list=data.routines;r=data.routines.length;}
    else data.routines.forEach(x=>{const names=S.routines.list.map(q=>q.name.toLowerCase());let n=x.name;if(names.includes(n.toLowerCase())){let i=2;while(names.includes((x.name+' ('+i+')').toLowerCase()))i++;n=x.name+' ('+i+')';}x.name=n;S.routines.list.push(x);r++;});
    save('routines');
  }
  if(data.foods.length){
    if(replace){S.foods.list=data.foods;f=data.foods.length;}
    else{const have=new Set(S.foods.list.map(q=>q.name.toLowerCase()));data.foods.forEach(x=>{if(!have.has(x.name.toLowerCase())){S.foods.list.push(x);have.add(x.name.toLowerCase());f++;}});}
    save('foods');
  }
  return 'Importado: '+r+' rutinas y '+f+' alimentos.';
}

const NATIVE=()=>{try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}};
const plugCache={};
function getPlug(n){if(!plugCache[n]){try{plugCache[n]=Capacitor.registerPlugin(n);}catch(e){plugCache[n]=null;}}return plugCache[n];}
async function notifState(){
  if(NATIVE()){try{const r=await getPlug('LocalNotifications').checkPermissions();return r.display==='granted'?'granted':r.display==='denied'?'denied':'default';}catch(e){return 'unsupported';}}
  if(!('Notification' in window)) return 'unsupported'; return Notification.permission;
}
async function askNotif(){

  try{return await Notification.requestPermission();}catch(e){return 'unsupported';}

/* En Android Chrome «new Notification()» no existe: hay que pasar por el service worker. */
async function showSys(title,body){
  if(NATIVE()){try{await getPlug('LocalNotifications').schedule({notifications:[{id:9001,title,body,schedule:{at:new Date(Date.now()+700)},channelId:'agua',actionTypeId:'WATER'}]});return true;}catch(e){return false;}}
  try{const reg=await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification){await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'forja-agua',renotify:true,vibrate:[200,100,200],actions:[{action:'drank',title:'Bebí 250 ml'}]});return true;}}catch(e){}
  try{new Notification(title,{body});return true;}catch(e){}
  return false;
}
async function scheduleNative(){
  if(!NATIVE()) return; const LN=getPlug('LocalNotifications'); if(!LN) return;
  try{
    const pend=await LN.getPending(); const old=(pend.notifications||[]).filter(n=>n.id>=1000&&n.id<9000).map(n=>({id:n.id}));
    if(old.length) await LN.cancel({notifications:old});
    const W=S.water; if(!W.on) return;
    const list=[], now=Date.now(), step=Math.max(15,W.interval)*60000; let id=1000;
    for(let day=0;day<3&&list.length<60;day++){
      const base=new Date(); base.setHours(0,0,0,0); base.setDate(base.getDate()+day);
      if(day===0&&todayMl()>=W.goal) continue;
      for(let t=base.getTime()+W.from*3600000;t<base.getTime()+W.to*3600000&&list.length<60;t+=step){
        if(t<=now+30000) continue;
        list.push({id:id++,title:'Forja · Agua',body:'Hora de tomar agua. Meta de hoy: '+W.goal+' ml.',schedule:{at:new Date(t),allowWhileIdle:true},channelId:'agua',actionTypeId:'WATER'});
      }
    }
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){}
}

  if(!NATIVE()) return; const LN=getPlug('LocalNotifications'); if(!LN) return;
  try{
    await LN.createChannel({id:'agua',name:'Recordatorio de agua',importance:4,vibration:true});
    await LN.registerActionTypes({types:[{id:'WATER',actions:[{id:'drank',title:'Bebí 250 ml'}]}]});
    LN.addListener('localNotificationActionPerformed',ev=>{if(ev&&ev.actionId==='drank'){addWater(250);toast('Anotados 250 ml.');}});
    scheduleNative();
  }catch(e){}
}

  const st=await notifState(), nat=NATIVE();
  const msg=nat?(st==='granted'?'Activos: Forja programa los avisos en el teléfono y suenan aunque la app esté cerrada.':'Falta el permiso de notificaciones.'):
    st==='granted'?'Permiso concedido. En la versión web, Android solo deja avisar con la app abierta o recién usada; con la app cerrada no es fiable.':
    st==='denied'?'Las notificaciones están bloqueadas. Actívalas en Ajustes de Android > Apps > Chrome > Notificaciones.':
    st==='unsupported'?'Este navegador no permite notificaciones.':'Aún no diste permiso de notificaciones.';
  el.replaceChildren(h('p',{class:'small',style:'margin:0'},msg),
    h('div',{class:'row'},
      st==='default'?h('button',{class:'btn sm',type:'button',onclick:async()=>{const r=await askNotif();toast(r==='granted'?'Avisos activados.':'No se activaron los avisos.');drawSys(el);}},'Permitir avisos'):null,
      st==='granted'?h('button',{class:'btn ghost sm',type:'button',onclick:async()=>{const ok=await showSys('Forja','Así se verá tu recordatorio de agua.');toast(ok?'Aviso enviado. Mira la barra de notificaciones.':'No se pudo mostrar el aviso.');}},'Probar aviso ahora'):null),
    nat?null:h('p',{class:'small muted',style:'margin:0'},'Para recibir avisos de verdad con la app cerrada, instala la versión APK de Forja (ver Ajustes > Instalar en el móvil).'));
}

/* ---------- PROGRESO (utilidades de foto y video) ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function toJpeg(file,max=800,q=0.72){
  let src,w,h2;
  try{const b=await createImageBitmap(file,{imageOrientation:'from-image'});src=b;w=b.width;h2=b.height;}
  catch(e){const url=URL.createObjectURL(file);try{const im=await loadImg(url);src=im;w=im.naturalWidth;h2=im.naturalHeight;}finally{URL.revokeObjectURL(url);}}
  const s=Math.min(1,max/Math.max(w,h2)); const cv=document.createElement('canvas'); cv.width=Math.round(w*s); cv.height=Math.round(h2*s);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',q);
}
async function buildVideo(sec,outFn){
  const out=outFn(); if(!out) return;
  const list=Object.values(S.photos).sort((a,b)=>a.date<b.date?-1:1);
  out.replaceChildren(h('p',{class:'small muted'},'Creando video…'));
  const imgs=await Promise.all(list.map(p=>loadImg(p.img)));
  const W=540,H=720, cv=h('canvas',{width:W,height:H,class:'vid'}); out.replaceChildren(cv);
  const ctx=cv.getContext('2d');
  const draw=(im,a)=>{ctx.globalAlpha=a;const s=Math.max(W/im.width,H/im.height),w=im.width*s,hh=im.height*s;ctx.drawImage(im,(W-w)/2,(H-hh)/2,w,hh);ctx.globalAlpha=1;};
  const label=p=>{ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H-64,W,64);ctx.fillStyle='#fff';ctx.font='600 26px "DM Sans",system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(fmtDate(p.date),20,H-24);
    if(p.weight){ctx.textAlign='right';ctx.fillText(p.weight+' kg',W-20,H-24);ctx.textAlign='left';}};
  const frame=(i,k)=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);draw(imgs[i],1);if(i<imgs.length-1&&k>0.75)draw(imgs[i+1],(k-0.75)/0.25);label(list[k>0.75&&i<imgs.length-1&&k>0.9?i+1:i]);};
  let rec=null; const chunks=[];
  if(window.MediaRecorder&&cv.captureStream){
    try{const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
      rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:2500000}:undefined);
      rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);}; rec.start(250);}catch(e){rec=null;}
  }
  const total=sec*imgs.length*1000, t0=performance.now();
  await new Promise(res=>{const f=now=>{const t=now-t0;if(t>=total){res();return;}const i=Math.min(imgs.length-1,Math.floor(t/(sec*1000)));frame(i,(t-i*sec*1000)/(sec*1000));requestAnimationFrame(f);};requestAnimationFrame(f);});
  frame(imgs.length-1,0); await new Promise(r=>setTimeout(r,250));
  if(!rec) return out.append(h('p',{class:'small muted'},'Tu navegador no puede grabar el video, pero la vista previa ya se reprodujo.'));
  await new Promise(r=>{rec.onstop=r;rec.stop();});
  const blob=new Blob(chunks,{type:'video/webm'});
  let url=null; try{url=URL.createObjectURL(blob);}catch(e){}
  const dl=await getDl();
  out.replaceChildren(url?h('video',{class:'vid',controls:true,playsinline:true,src:url}):cv,
    dl?h('button',{class:'btn alt',style:'margin-top:10px;width:100%',type:'button',onclick:async()=>{try{await dl.save({filename:'mi-cambio-fisico.webm',data:blob});toast('Video guardado.');}catch(e){if(e&&e.code!=='declined')toast('No se pudo guardar el video.');}}},'Guardar video')
       :h('p',{class:'small muted'},'Guardar archivos no está disponible en esta vista.'));
}

/* Si el navegador muestra la página en «modo escritorio» (ancho ~980 px) en un móvil, la escala para llenar la pantalla. */
function fitScreen(){
  const root=document.documentElement; root.style.zoom=''; root.style.fontSize='';
  const cw=root.clientWidth, sw=screen.width||cw;
  if(navigator.maxTouchPoints>0&&sw<=900&&cw>sw*1.25) {root.style.zoom=String(Math.min(3,cw/sw)); root.style.fontSize=Math.min(18,Math.max(16,sw*0.042))+'px';}
}
fitScreen(); addEventListener('resize',fitScreen); addEventListener('orientationchange',()=>setTimeout(fitScreen,300));

if('serviceWorker' in navigator&&!NATIVE()){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
